<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi Mejor Amigo - Turnos</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- CSS propio -->
    <link rel="stylesheet" href="css/inicio.css">
</head>

<body>

    <!-- NAVBAR BOOTSTRAP -->
    <nav class="navbar navbar-expand-lg fixed-top navbar-mi-amigo">
        <div class="container-fluid navbar-contenido">

            <a class="navbar-brand marca-navbar" href="#">
                <img src="img/iconos/icono-pata.png" alt="Ícono de pata" class="icono-navbar">

                <span class="texto-marca">
                    <span class="marca-linea-uno">MI MEJOR</span>
                    <span class="marca-linea-dos">AMIGO</span>
                </span>
            </a>

            <button class="navbar-toggler boton-menu" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Abrir menú">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse menu-navbar" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="#">Inicio</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Servicios</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Consejos y bienestar</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Sacar turno</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Contacto</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Sobre nosotros</a>
                    </li>
                </ul>
            </div>

        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="pagina-turnos">

        <section class="hero-turnos">

            <h1 class="titulo-principal">
                <span class="titulo-celeste">Cuidado cercano</span>
                <span class="titulo-oscuro">y profesional para</span>
                <span class="titulo-oscuro">tu mascota</span>
            </h1>

            <p class="texto-descripcion">
                Bienestar, prevención y atención veterinaria integral para que viva más sano y feliz.
            </p>

            <section class="acciones-turnos">

                <a href="#" class="boton boton-turno">
                    <img src="img/iconos/calendario-blanco.png" alt="Calendario" class="icono-boton">
                    Sacar turno
                </a>

                <a href="#" class="boton boton-whatsapp">
                    <img src="img/iconos/whatsapp-gris.png" alt="WhatsApp" class="icono-boton">
                    WhatsApp
                </a>

            </section>

            <figure class="imagen-mascota">
                <img src="img/animales/perro-2.png" alt="Perro" class="perro-turnos">
            </figure>

        </section>

    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</html>
